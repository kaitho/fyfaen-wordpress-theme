name: Deploy FYFAEN theme to one.com staging

on:
  push:
    branches:
      - staging
  workflow_dispatch:

concurrency:
  group: fyfaen-staging-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy theme only
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy theme to one.com staging
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.ONECOM_FTP_SERVER }}
          username: ${{ secrets.ONECOM_FTP_USERNAME }}
          password: ${{ secrets.ONECOM_FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./
          server-dir: ${{ secrets.ONECOM_STAGING_THEME_DIR }}
          exclude: |
            **/.git*/**
            **/.github/**
            **/docs/**
            **/.DS_Store
            **/README.md
            **/CHANGELOG.md
            **/VERSION
            **/LICENSE
